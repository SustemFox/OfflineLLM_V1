// ci-trigger: vulkan-safe-20260724
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'com.example.offlinellm'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.offlinellm'
        minSdk 28
        targetSdk 34
        versionCode 23
        versionName '1.6.3-vulkan-safe'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O3 -fvisibility=hidden'
                arguments '-DANDROID_STL=c++_shared',
                          '-DGGML_NATIVE=OFF',
                          '-DOFFLINELLM_LLAMA_TAG=b10079',
                          '-DOFFLINELLM_ENABLE_OPENCL=ON',
                          '-DOFFLINELLM_ENABLE_VULKAN=ON',
                          "-DSPIRV-Headers_DIR=${projectDir}/src/main/cpp/third_party/vulkan-host/spirv-headers/share/cmake/SPIRV-Headers",
                          "-DCMAKE_PREFIX_PATH=${projectDir}/src/main/cpp/third_party/vulkan-host/spirv-headers" 
            }
        }
    }

    signingConfigs {
        debug {
            storeFile file("${System.properties['user.home']}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles(
                getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
            )
        }
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.1'
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
            '-opt-in=androidx.compose.material3.ExperimentalMaterial3Api'
        ]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += '/META-INF/INDEX.LIST'
            excludes += '/META-INF/io.netty.versions.properties'
            excludes += '/META-INF/*.kotlin_module'
            excludes += '/META-INF/NOTICE'
            excludes += '/META-INF/NOTICE.txt'
            excludes += '/META-INF/LICENSE'
            excludes += '/META-INF/LICENSE.txt'
            excludes += '/META-INF/DEPENDENCIES'
        }
        jniLibs {
            useLegacyPackaging true
            excludes += '**/libggml-vulkan.so'
            excludes += '**/libmtmd.so'
            excludes += '**/libllama-common.so'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    ndkVersion '26.1.10909125'
}

def thirdParty = file('src/main/cpp/third_party')
def openClRoot = file("${thirdParty}/opencl")
def openClHeadersSrc = file("${thirdParty}/OpenCL-Headers")
def openClIcdSrc = file("${thirdParty}/OpenCL-ICD-Loader")
def jniArm64 = file('src/main/jniLibs/arm64-v8a')

tasks.register('cloneLlamaCpp', Exec) {
    def dest = file("${thirdParty}/llama.cpp")
    outputs.dir(dest)
    onlyIf { !new File(dest, 'CMakeLists.txt').exists() }
    workingDir = thirdParty
    doFirst { workingDir.mkdirs() }
    commandLine 'git', 'clone', '--depth', '1', '--branch', 'b10079',
            'https://github.com/ggml-org/llama.cpp.git', 'llama.cpp'
}

tasks.register('cloneOpenClHeaders', Exec) {
    outputs.dir(openClHeadersSrc)
    onlyIf { !new File(openClHeadersSrc, 'CL/cl.h').exists() }
    workingDir = thirdParty
    doFirst { workingDir.mkdirs() }
    commandLine 'git', 'clone', '--depth', '1',
            'https://github.com/KhronosGroup/OpenCL-Headers.git', 'OpenCL-Headers'
}

tasks.register('cloneOpenClIcd', Exec) {
    outputs.dir(openClIcdSrc)
    onlyIf { !new File(openClIcdSrc, 'CMakeLists.txt').exists() }
    workingDir = thirdParty
    doFirst { workingDir.mkdirs() }
    commandLine 'git', 'clone', '--depth', '1',
            'https://github.com/KhronosGroup/OpenCL-ICD-Loader.git', 'OpenCL-ICD-Loader'
}

tasks.register('stageOpenClHeaders', Copy) {
    dependsOn 'cloneOpenClHeaders'
    from("${openClHeadersSrc}/CL")
    into("${openClRoot}/include/CL")
}

tasks.register('buildOpenClIcd') {
    dependsOn 'cloneOpenClIcd', 'stageOpenClHeaders'
    def outLib = file("${openClRoot}/lib/libOpenCL.so")
    outputs.file(outLib)
    doLast {
        def ndk = System.getenv('ANDROID_NDK_HOME') ?: System.getenv('ANDROID_NDK') ?: System.getenv('NDK_ROOT')
        if (ndk == null || !(new File(ndk).exists())) {
            def localProps = new File(rootProject.projectDir, 'local.properties')
            if (localProps.exists()) {
                localProps.eachLine { line ->
                    if (line.startsWith('ndk.dir=')) ndk = line.substring('ndk.dir='.length()).trim()
                    if (line.startsWith('sdk.dir=') && ndk == null) {
                        def sdk = line.substring('sdk.dir='.length()).trim()
                        def cand = new File(sdk, "ndk/${android.ndkVersion}")
                        if (cand.exists()) ndk = cand.absolutePath
                    }
                }
            }
        }
        if (ndk == null || !(new File(ndk).exists())) {
            def sdkRoot = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
            if (sdkRoot != null) {
                def cand = new File(sdkRoot, "ndk/${android.ndkVersion}")
                if (cand.exists()) ndk = cand.absolutePath
            }
        }
        if (ndk == null || !(new File(ndk).exists())) {
            throw new GradleException("ANDROID_NDK_HOME / NDK not found for OpenCL ICD build")
        }
        def toolchain = "${ndk}/build/cmake/android.toolchain.cmake"
        def buildDir = file("${openClIcdSrc}/build_android_arm64")
        buildDir.mkdirs()
        new File(openClRoot, 'lib').mkdirs()
        new File(openClRoot, 'include').mkdirs()

        exec {
            workingDir buildDir
            commandLine 'cmake', openClIcdSrc.absolutePath,
                    '-G', 'Ninja',
                    "-DCMAKE_TOOLCHAIN_FILE=${toolchain}",
                    '-DANDROID_ABI=arm64-v8a',
                    '-DANDROID_PLATFORM=android-28',
                    '-DANDROID_STL=c++_shared',
                    '-DCMAKE_BUILD_TYPE=Release',
                    "-DOPENCL_ICD_LOADER_HEADERS_DIR=${openClRoot}/include",
                    '-DBUILD_SHARED_LIBS=ON'
        }
        exec {
            workingDir buildDir
            commandLine 'cmake', '--build', '.', '--config', 'Release', '-j', '4'
        }
        def built = file("${buildDir}/libOpenCL.so")
        if (!built.exists()) {
            def alt = fileTree(buildDir).matching { include '**/libOpenCL.so' }.files.find { it.isFile() }
            if (alt == null) throw new GradleException("libOpenCL.so not produced in ${buildDir}")
            built = alt
        }
        copy {
            from built
            into "${openClRoot}/lib"
        }
        jniArm64.mkdirs()
        copy {
            from "${openClRoot}/lib/libOpenCL.so"
            into jniArm64
        }
        println "Staged OpenCL ICD: ${openClRoot}/lib/libOpenCL.so and jniLibs"
    }
}


// --- Vulkan host tools (glslc + SPIRV-Headers) for GGML_VULKAN shader codegen ---
def vulkanHost = file("${thirdParty}/vulkan-host")

// Vulkan-Hpp headers (NDK only ships C vulkan.h, ggml-vulkan needs vulkan.hpp)
def vulkanHeadersSrc = file("${thirdParty}/Vulkan-Headers")
def vulkanHeadersInc = file("${vulkanHost}/include")

tasks.register('cloneVulkanHeaders', Exec) {
    outputs.dir(vulkanHeadersSrc)
    onlyIf { !new File(vulkanHeadersSrc, 'include/vulkan/vulkan.hpp').exists() }
    workingDir = thirdParty
    doFirst { workingDir.mkdirs() }
    commandLine 'git', 'clone', '--depth', '1',
            'https://github.com/KhronosGroup/Vulkan-Headers.git', 'Vulkan-Headers'
}

tasks.register('stageVulkanHpp') {
    dependsOn 'cloneVulkanHeaders'
    def marker = file("${vulkanHeadersInc}/vulkan/.staged")
    outputs.file(marker)
    doLast {
        def src = file("${vulkanHeadersSrc}/include")
        if (!new File(src, 'vulkan/vulkan.hpp').exists()) {
            throw new GradleException("Vulkan-Headers missing vulkan.hpp at ${src}")
        }
        copy {
            from src
            into vulkanHeadersInc
        }
        marker.parentFile.mkdirs()
        marker.text = "ok\n"
        println "Vulkan-Hpp staged -> ${vulkanHeadersInc}"
    }
}

def spirvHeadersSrc = file("${thirdParty}/SPIRV-Headers")
def spirvHeadersPrefix = file("${vulkanHost}/spirv-headers")

tasks.register('cloneSpirvHeaders', Exec) {
    outputs.dir(spirvHeadersSrc)
    onlyIf { !new File(spirvHeadersSrc, 'CMakeLists.txt').exists() }
    workingDir = thirdParty
    doFirst { workingDir.mkdirs() }
    commandLine 'git', 'clone', '--depth', '1',
            'https://github.com/KhronosGroup/SPIRV-Headers.git', 'SPIRV-Headers'
}

tasks.register('installSpirvHeaders') {
    dependsOn 'cloneSpirvHeaders'
    def marker = file("${spirvHeadersPrefix}/.installed")
    outputs.file(marker)
    doLast {
        spirvHeadersPrefix.mkdirs()
        def buildDir = file("${spirvHeadersSrc}/build_install")
        buildDir.mkdirs()
        exec {
            workingDir buildDir
            commandLine 'cmake', spirvHeadersSrc.absolutePath,
                    "-DCMAKE_INSTALL_PREFIX=${spirvHeadersPrefix.absolutePath}"
        }
        exec {
            workingDir buildDir
            commandLine 'cmake', '--install', '.'
        }
        marker.text = "ok\n"
        println "SPIRV-Headers installed -> ${spirvHeadersPrefix}"
    }
}

tasks.register('stageGlslc') {
    def glslcOut = file("${vulkanHost}/bin/glslc")
    outputs.file(glslcOut)
    doLast {
        vulkanHost.mkdirs()
        new File(vulkanHost, 'bin').mkdirs()
        // Prefer system glslc (apt on GHA / dev machines)
        def proc = ["bash", "-lc", "command -v glslc || true"].execute()
        proc.waitFor()
        def sys = proc.text.trim()
        if (sys) {
            ant.copy(file: sys, tofile: glslcOut.absolutePath, overwrite: true)
            ant.chmod(file: glslcOut.absolutePath, perm: "755")
            println "glslc staged from system: ${sys}"
            return
        }
        // Try sudo apt on passwordless CI runners
        def apt = ["bash", "-lc", "sudo -n apt-get update -qq && sudo -n apt-get install -y -qq glslc libvulkan-dev spirv-headers 2>/dev/null; command -v glslc || true"].execute()
        apt.waitFor()
        sys = apt.text.trim().readLines().find { it.contains("glslc") || it.startsWith("/") } ?: apt.text.trim()
        // re-check
        proc = ["bash", "-lc", "command -v glslc || true"].execute()
        proc.waitFor()
        sys = proc.text.trim()
        if (sys) {
            ant.copy(file: sys, tofile: glslcOut.absolutePath, overwrite: true)
            ant.chmod(file: glslcOut.absolutePath, perm: "755")
            println "glslc staged after apt: ${sys}"
            return
        }
        println "WARNING: glslc not found — Vulkan backend will be disabled at CMake configure"
        // create empty marker so task doesn't rebuild forever without tool
        if (!glslcOut.exists()) {
            glslcOut.text = "#!/bin/sh\necho 'glslc missing' >&2\nexit 1\n"
            ant.chmod(file: glslcOut.absolutePath, perm: "755")
        }
    }
}

tasks.register('stageVulkanHostDeps') {
    dependsOn 'installSpirvHeaders', 'stageGlslc', 'stageVulkanHpp'
}


tasks.configureEach { task ->
    if (task.name.startsWith('configureCMake') || task.name.startsWith('buildCMake') || task.name.startsWith('externalNativeBuild')) {
        task.dependsOn('cloneLlamaCpp', 'buildOpenClIcd', 'stageVulkanHostDeps')
    }
    if (task.name.startsWith('mergeReleaseNativeLibs') || task.name.startsWith('mergeDebugNativeLibs')) {
        task.dependsOn('buildOpenClIcd')
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation "androidx.documentfile:documentfile:1.0.1"
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.2'
    implementation 'androidx.activity:activity-compose:1.8.0'
    implementation platform('androidx.compose:compose-bom:2023.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.0'

    implementation 'io.ktor:ktor-server-core:2.3.7'
    implementation 'io.ktor:ktor-server-netty:2.3.7'
    implementation 'io.ktor:ktor-server-content-negotiation:2.3.7'
    implementation 'io.ktor:ktor-serialization-kotlinx-json:2.3.7'
}
